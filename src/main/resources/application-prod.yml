spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pawstockdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

    driver-class-name: com.mysql.cj.jdbc.Driver

    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: false

  # Restrict repeatedly insert development sample data
  # into the persistent production database.
  sql:
    init:
      mode: never

  # H2 Console not available in production.
  h2:
    console:
      enabled: false
