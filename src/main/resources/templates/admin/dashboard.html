<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Admin Dashboard | PawStock Warehouse</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body class="d-flex flex-column min-vh-100 admin-bg">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
  <div class="content-card">
    <h1>Admin Dashboard</h1>

    <p class="text-secondary">Manage Pawstock Users</p>

    <table class="table table-striped">
      <thead>
      <tr>
        <th>Username</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.username}">Username</td>
        <td th:text="${user.fullName}">Full Name</td>
        <td th:text="${user.email}">Email</td>
        <td>
          <!-- Admin can change roles -->
          <form
            th:action="@{/admin/users/{id}/role(id=${user.userId})}"
            method="post"
          >

            <select name="role" class="form-select">
              <option
                th:each="role : ${roles}"
                th:value="${role}"
                th:text="${role}"
                th:selected="${user.role == role}"
              >
                Role
              </option>
            </select>

            <button type="submit" class="btn btn-primary mt-2">
              Update Role
            </button>
          </form>
        </td>
        <td>
          <!-- Admin can delete users -->
          <form
            th:action="@{/admin/users/{id}/delete(id=${user.userId})}"
            method="post"
          >

            <button type="submit" class="btn btn-danger mt-2">
              Delete User
            </button>
          </form>
        </td>
      </tbody>
    </table>


  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
