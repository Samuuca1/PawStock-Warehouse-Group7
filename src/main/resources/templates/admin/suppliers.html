<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Supplier Management | PawStock Warehouse</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">
      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
      >
        <span th:text="${successMessage}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div
        th:if="${errorMessage}"
        class="alert alert-danger alert-dismissible fade show"
      >
        <span th:text="${errorMessage}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="badge text-bg-danger mb-2"> Administrator Only </span>

          <h1>Supplier Management</h1>

          <p class="text-secondary mb-0">
            Manage suppliers available to PawStock products.
          </p>
        </div>

        <a th:href="@{/admin}" class="btn btn-outline-secondary">
          Back to Admin
        </a>
      </div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Add Supplier</h2>

          <form
            th:action="@{/admin/suppliers/add}"
            method="post"
            class="row g-3"
          >
            <div class="col-md-4">
              <label class="form-label"> Supplier Name </label>

              <input
                name="supplierName"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="col-md-4">
              <label class="form-label"> Email </label>

              <input name="email" type="email" class="form-control" required />
            </div>

            <div class="col-md-2">
              <label class="form-label"> Phone </label>

              <input name="phone" type="text" class="form-control" />
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">
                Add Supplier
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Existing Suppliers</h2>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Supplier</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Update</th>
                  <th>Delete</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="supplier : ${suppliers}">
                  <form
                    th:action="@{/admin/suppliers/{id}/update(id=${supplier.supplierId})}"
                    method="post"
                  >
                    <td>
                      <input
                        name="supplierName"
                        class="form-control form-control-sm"
                        th:value="${supplier.supplierName}"
                        required
                      />
                    </td>

                    <td>
                      <input
                        name="email"
                        type="email"
                        class="form-control form-control-sm"
                        th:value="${supplier.email}"
                        required
                      />
                    </td>

                    <td>
                      <input
                        name="phone"
                        class="form-control form-control-sm"
                        th:value="${supplier.phone}"
                      />
                    </td>

                    <td>
                      <button type="submit" class="btn btn-primary btn-sm">
                        Update
                      </button>
                    </td>
                  </form>

                  <td>
                    <form
                      th:action="@{/admin/suppliers/{id}/delete(id=${supplier.supplierId})}"
                      method="post"
                      onsubmit="return confirm('Delete this supplier?');"
                    >
                      <button
                        type="submit"
                        class="btn btn-outline-danger btn-sm"
                      >
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>

                <tr th:if="${#lists.isEmpty(suppliers)}">
                  <td colspan="5" class="text-center text-secondary py-4">
                    No suppliers have been added.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
