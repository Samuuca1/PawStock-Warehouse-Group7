<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Category Management | PawStock Warehouse</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">
      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
      >
        <span th:text="${successMessage}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div
        th:if="${errorMessage}"
        class="alert alert-danger alert-dismissible fade show"
      >
        <span th:text="${errorMessage}"></span>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="badge text-bg-danger mb-2"> Administrator Only </span>

          <h1>Category Management</h1>

          <p class="text-secondary mb-0">
            Manage categories available to PawStock products.
          </p>
        </div>

        <a th:href="@{/admin}" class="btn btn-outline-secondary">
          Back to Admin
        </a>
      </div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Add Category</h2>

          <form
            th:action="@{/admin/categories/add}"
            method="post"
            class="row g-3"
          >
            <div class="col-md-5">
              <label class="form-label"> Category Name </label>

              <input
                name="categoryName"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="col-md-5">
              <label class="form-label"> Description </label>

              <input name="description" type="text" class="form-control" />
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">
                Add Category
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Existing Categories</h2>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Update</th>
                  <th>Delete</th>
                </tr>
              </thead>

              <tbody>
                <tr th:each="category : ${categories}">
                  <form
                    th:action="@{/admin/categories/{id}/update(id=${category.categoryId})}"
                    method="post"
                  >
                    <td>
                      <input
                        name="categoryName"
                        class="form-control form-control-sm"
                        th:value="${category.categoryName}"
                        required
                      />
                    </td>

                    <td>
                      <input
                        name="description"
                        class="form-control form-control-sm"
                        th:value="${category.description}"
                      />
                    </td>

                    <td>
                      <button type="submit" class="btn btn-primary btn-sm">
                        Update
                      </button>
                    </td>
                  </form>

                  <td>
                    <form
                      th:action="@{/admin/categories/{id}/delete(id=${category.categoryId})}"
                      method="post"
                      onsubmit="return confirm('Delete this category?');"
                    >
                      <button
                        type="submit"
                        class="btn btn-outline-danger btn-sm"
                      >
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>

                <tr th:if="${#lists.isEmpty(categories)}">
                  <td colspan="4" class="text-center text-secondary py-4">
                    No categories have been added.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
